name: Windows offline smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell 5.1 packaging and wrapper smoke
        shell: powershell
        run: .\tests\mechanical-smoke.ps1
      - name: Git Bash packaging and cross-shell smoke
        shell: bash
        run: bash ./tests/run-git-bash.sh
      - name: Doctor report shape and sandbox mapping
        shell: powershell
        env:
          XLOOP_HEADLESS: '1'
        run: |
          # The agent CLIs are absent on CI, so doctor's non-zero exit is expected.
          # What must hold is that it still emits a parsable report with the
          # platform-correct read-intent sandbox.
          $report = (.\scripts\doctor.ps1 | Out-String) | ConvertFrom-Json
          if ($report.checks.review_sandbox.read_intent_codex_sandbox -ne 'workspace-write') {
            throw "Windows read-intent mapped to $($report.checks.review_sandbox.read_intent_codex_sandbox)."
          }
          if (-not $report.checks.powershell_5_1.ok) { throw 'CI did not run Windows PowerShell 5.1.' }
          Write-Output 'Doctor report validated.'

  peer-sessions-offline:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/peer-sessions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugins/peer-sessions/package-lock.json
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Protocol, policy, and concurrency tests
        run: npm test
      - name: Windows process-tree termination
        run: npm run test:tree
      - name: Package privacy and structure
        run: npm run validate
      - name: PowerShell 5.1 parse and MCPB pack
        shell: powershell
        run: |
          [void][ScriptBlock]::Create((Get-Content .\scripts\open-viewer.ps1 -Raw))
          [void][ScriptBlock]::Create((Get-Content .\scripts\set-private-acl.ps1 -Raw))
          [void][ScriptBlock]::Create((Get-Content .\scripts\pack-mcpb.ps1 -Raw))
          npm run pack
